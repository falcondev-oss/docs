publicHoistPattern:
  - eslint-plugin-*
  - '@prettier/plugin-*'

packages:
  - packages/*

overrides:
  brace-expansion@<1.1.21: ^1.1.21
  # VitePress 1.x bundles @types/markdown-it 14.1 into its own types; 14.2 breaks md.use() for plugins
  '@types/markdown-it': 14.1.2

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
